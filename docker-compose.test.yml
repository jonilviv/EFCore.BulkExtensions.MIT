# Test databases for local development (ports and credentials match testsettings.docker.json).
# Requires Docker Desktop. Start: scripts/start-test-databases.ps1

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU13-ubuntu-22.04
    container_name: efcore-bulkextensions-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: efcore-bulkextensions-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres22
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    container_name: efcore-bulkextensions-mysql
    environment:
      MYSQL_ROOT_PASSWORD: MySQL22
    ports:
      - "3306:3306"
    command: --local-infile=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pMySQL22"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
